<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - Harbour &amp; Hearth</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/analytics.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="gift-card-widget/dist/gift-card-widget.iife.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <h1>Harbour &amp; Hearth</h1>
            <p class="tagline">Coffee, bread, community</p>
        </div>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="booking.html" aria-current="page">Bookings</a>
            <a href="team.html">Our Team</a>
            <a href="gift-card.html">Gift cards</a>
            <a href="/wp/">News</a>
        </nav>
    </header>

    <main>
        <section class="signup">
            <h2>Book a table or a private event</h2>
            <p>Fill in your details below. We'll be in touch within one business day.</p>

            <form action="/wp-json/hh/v1/bookings" method="POST" class="booking-form">
                <input type="text" name="name" placeholder="Full name" required>
                <input type="email" name="email" placeholder="Email address" required>
                <input type="tel" name="phone" placeholder="Phone">
                <input type="date" name="date" required>
                <input type="number" name="guests" placeholder="Number of guests" min="1">
                <input type="text" name="suburb" placeholder="Your suburb">

                <select name="location" required>
                    <option value="">Preferred location</option>
                    <option value="northbridge">Northbridge</option>
                    <option value="fremantle">Fremantle</option>
                    <option value="claremont">Claremont</option>
                </select>

                <select name="occasion" required>
                    <option value="">What's the occasion?</option>
                    <option value="table">Table booking</option>
                    <option value="private">Private event</option>
                    <option value="corporate">Corporate order</option>
                </select>

                <textarea name="notes" placeholder="Anything we should know? (dietary needs, accessibility, timing)"></textarea>

                <button type="submit" class="btn-primary">Send booking enquiry</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>Harbour &amp; Hearth Pty Ltd. ABN 12 345 678 901.</p>
        <p>Questions? Email <a href="mailto:hello@harbourandhearth.com.au">hello@harbourandhearth.com.au</a></p>
    </footer>
</body>
</html>
